<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="fpReportStyles.css" />
    <link rel="stylesheet" href="ouOutlierStyles.css" />
    <link rel="stylesheet" href="charlotte-v10-upgrades.css" />
    <link rel="stylesheet" href="v11VisualDirectionCSS.css" />
    <link rel="stylesheet" href="v12MediaOrganizerCSS.css" />

    <title>Charlotte AI</title>  
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">c<span style="font-size:13px;align-self:flex-start;margin-top:8px">✦</span></div>
          <div><strong>Charlotte AI</strong><small>NAOMI SOCIAL STUDIO</small></div>
        </div>
        <div class="role-select"><button id="roleCharlotte" class="active"
            onclick="switchRole('charlotte')">Charlotte</button><button id="roleNaomi"
            onclick="switchRole('naomi')">Naomi</button></div>
        <div class="side-heading" id="sideHeading">WORKSPACE</div>
        <nav class="nav" id="navigation" aria-label="Primary navigation"></nav>
        <div class="side-foot">
          <div class="foot-title">
            <div class="av">NA</div><span>Naomi's Social Studio</span>
          </div>
          <p>One place for stories, assets, approvals and insights.</p>
        </div>
      </aside>
      <div class="app">
        <header class="topbar">
          <div class="crumb">Workspace <span style="margin:0 6px;color:#c4c4c4">/</span> <strong
              id="crumb">Overview</strong></div>
          <div class="top-actions"><span class="prototype-chip">V5 DESIGN · V12 MEDIA ORGANIZER</span><button
              class="circle-btn" title="Reset all demo data" onclick="resetDemo()">↻</button>
            <div class="avatar" id="avatar">CF</div>
          </div>
        </header>
        <main class="main" id="main" role="main"></main>
      </div>
    </div>
    <div class="drawer-wrap" id="drawerWrap" aria-hidden="true">
      <div class="shade" onclick="closeDrawer()"></div>
      <section class="drawer" role="dialog" aria-modal="true" aria-label="Post editor">
        <div class="drawer-head">
          <div>
            <div class="eyebrow" id="drawerOver" style="margin:0 0 5px">POST STUDIO</div><strong id="drawerTitle"
              style="font-size:16px">Edit post</strong>
          </div><button class="close" aria-label="Close editor" onclick="closeDrawer()">×</button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <input type="file" id="filePicker" accept="image/*,video/*,audio/*" multiple hidden>
    <input type="file" id="replacePicker" accept="image/*,video/*" hidden>
   
    <script type="text/javascript" src="script.js"></script>
    <script type="text/javascript" src="charlotte-v10-upgrades.js"></script>
  </body>
</html>
